[package]
name = "wt"
version = "0.1.0"
edition = "2024"
description = "Keep one git worktree per branch, checked out beside the main checkout"
license = "MIT"
repository = "https://github.com/alksl/wt"
readme = "README.md"
keywords = ["git", "worktree", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anstream = "1.0.0"
anstyle = "1.0.14"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
gix = { version = "0.88.0", default-features = false, features = ["revision", "sha1"] }
unicode-width = { version = "0.2.2", default-features = false }

[dev-dependencies]
tempfile = "3.27.0"
